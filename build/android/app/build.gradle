plugins {
    id 'com.android.application'
}

def changelogFile = rootProject.file('../../CHANGELOG.md')
if (!changelogFile.isFile()) {
    throw new GradleException("Release changelog not found: ${changelogFile}")
}
def releaseHeading = changelogFile.readLines('UTF-8').find { it ==~ /^##[ \t]+.*$/ }
def versionMatch = releaseHeading == null
    ? null
    : releaseHeading =~ /^##[ \t]+((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))[ \t]*$/
if (versionMatch == null || !versionMatch.matches()) {
    throw new GradleException('The first CHANGELOG.md section must use the exact ## X.Y.Z format')
}
def appVersion = versionMatch.group(1)
def versionParts = appVersion.tokenize('.').collect { it as long }
if (versionParts[1] > 999 || versionParts[2] > 999) {
    throw new GradleException("Android release versions require minor and patch values below 1000: ${appVersion}")
}
def appVersionCode = versionParts[0] * 1_000_000L + versionParts[1] * 1_000L + versionParts[2]
if (appVersionCode < 1 || appVersionCode > 2_100_000_000L) {
    throw new GradleException("Android versionCode is outside the supported range: ${appVersionCode}")
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "app.onecatch.mobile"
        minSdk 21
        targetSdk 35
        versionCode appVersionCode as int
        versionName appVersion

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
