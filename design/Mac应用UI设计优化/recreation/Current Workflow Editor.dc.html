<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body { margin: 0; background: #f2f4ef; }
  a, a:hover { color: #557be8; }
</style>
</helmet>
<div data-screen-label="现状 · Workflow 编辑器" style="width: 1280px; height: 800px; position: relative;">
  <div class="modal-backdrop" style="position: absolute;">
    <div class="modal wide" style="height: 720px;">
      <div class="modal-header"><div><h2>Workflow 编辑器</h2><p>步骤发出 signal，转移表决定继续、回环、暂停或完成</p></div><button class="icon-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
      <div class="editor-layout">
        <div class="editor-main">
          <div class="editor-basics">
            <label>Workflow ID<input value="implement_review"></label>
            <label>名称<input value="实现与审查 Loop"></label>
            <label class="full">描述<textarea>实现者完成改动，审查者检查；有问题就自动回到实现。</textarea></label>
            <label>入口步骤<select><option>实现</option><option>审查</option></select></label>
            <label>最大转移次数<input type="number" value="20"></label>
          </div>
          <div class="editor-section-title"><div><h3>步骤与转移</h3><p>普通 target 指向步骤，保留 target 为 $done / $pause / $fail。</p></div><button class="secondary-button compact"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>添加步骤</button></div>
          <div class="step-editor-list">
            <div class="step-editor">
              <div class="step-editor-number">1</div>
              <div class="step-editor-body">
                <div class="step-editor-grid">
                  <label>Step ID<input value="implement"></label>
                  <label>显示名称<input value="实现"></label>
                  <label>Runtime<select><option>Codex</option><option>Claude Code</option></select></label>
                  <label>Sandbox<select><option>Workspace write</option><option>Read only</option><option>Full access</option></select></label>
                  <label class="full">角色提示<textarea>你是负责落地代码和测试的实现者。</textarea></label>
                  <label class="full">步骤指令<textarea>实现目标、运行验证，并把变更交给审查者。</textarea></label>
                </div>
                <div class="transition-editor">
                  <span>Signals &amp; targets</span>
                  <div class="transition-row"><input value="ready_for_review"><span>→</span><input value="review"><button><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
                  <div class="transition-row"><input value="need_human"><span>→</span><input value="$pause"><button><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
                  <button class="text-button"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>添加 signal</button>
                </div>
              </div>
            </div>
            <div class="step-editor">
              <div class="step-editor-number">2</div>
              <div class="step-editor-body">
                <div class="step-editor-grid">
                  <label>Step ID<input value="review"></label>
                  <label>显示名称<input value="审查"></label>
                  <label>Runtime<select><option>Claude Code</option><option>Codex</option></select></label>
                  <label>Sandbox<select><option>Read only</option><option>Workspace write</option><option>Full access</option></select></label>
                  <label class="full">角色提示<textarea>你是独立、严格的代码审查者。</textarea></label>
                  <label class="full">步骤指令<textarea>检查需求、实现、风险和测试；有问题要求修改。</textarea></label>
                </div>
                <div class="transition-editor">
                  <span>Signals &amp; targets</span>
                  <div class="transition-row"><input value="changes_requested"><span>→</span><input value="implement"><button><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
                  <div class="transition-row"><input value="approved"><span>→</span><input value="$done"><button><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
                  <div class="transition-row"><input value="need_human"><span>→</span><input value="$pause"><button><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
                  <button class="text-button"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>添加 signal</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <aside class="editor-side">
          <div class="graph-preview">
            <span class="kicker">FLOW PREVIEW</span>
            <div class="graph-node"><span>1</span><div><strong>实现</strong><small>codex</small></div></div>
            <div class="graph-node"><span>2</span><div><strong>审查</strong><small>claude</small></div></div>
            <div class="graph-legend"><span><i class="done"></i>$done</span><span><i class="pause"></i>$pause</span><span><i class="loop"></i>回边 / 下一步</span></div>
          </div>
          <div class="validation-box valid">
            <div><strong>等待校验</strong><button class="text-button">立即校验</button></div>
            <p>保存时会检查入口、可达性、完成路径和 policy 边界。</p>
          </div>
        </aside>
      </div>
      <div class="editor-footer"><button class="secondary-button">取消</button><button class="primary-button">校验并保存</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}"></script>
</body>
</html>
