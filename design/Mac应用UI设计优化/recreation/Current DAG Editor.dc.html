<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body { margin: 0; background: #f2f4ef; }
  a, a:hover { color: #557be8; }
</style>
</helmet>
<div data-screen-label="现状 · DAG 画布" style="width: 1280px; height: 800px; position: relative;">
  <div class="modal-backdrop" style="position: absolute;">
    <div class="modal wide" style="height: 740px;">
      <div class="modal-header"><div><h2>并行 DAG 画布</h2><p>拖动节点；点击节点右上连接点，再点击目标节点连接点创建依赖</p></div><button class="icon-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
      <div class="dag-editor-shell">
        <div class="dag-toolbar">
          <div class="dag-meta"><input value="parallel_review"><input value="并行审查 DAG"></div>
          <div><span class="mode-chip dag">DAG · ALL JOIN</span><button class="secondary-button compact">自动布局</button><button class="primary-button compact"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>节点</button></div>
        </div>
        <div class="dag-workspace">
          <div class="dag-canvas">
            <svg class="dag-edges" viewBox="0 0 900 560" preserveAspectRatio="none">
              <g class="dag-edge"><path d="M 260 118 C 330 118, 360 213, 430 213"></path><text x="345" y="158">×</text></g>
              <g class="dag-edge"><path d="M 260 308 C 330 308, 360 213, 430 213"></path><text x="345" y="253">×</text></g>
            </svg>
            <div class="dag-node-card selected" style="left: 70px; top: 70px;">
              <button class="dag-port input"></button>
              <div class="dag-node-head"><span class="runtime-badge codex" style="color: #168d54; border-color: rgba(0,0,0,.1);">codex</span><small>local</small></div>
              <strong>安全审查</strong>
              <p>Root · 可并行</p>
              <button class="dag-port output"></button>
            </div>
            <div class="dag-node-card" style="left: 70px; top: 260px;">
              <button class="dag-port input"></button>
              <div class="dag-node-head"><span class="runtime-badge claude" style="color: #c06232; border-color: rgba(0,0,0,.1);">claude</span><small>local</small></div>
              <strong>测试审查</strong>
              <p>Root · 可并行</p>
              <button class="dag-port output"></button>
            </div>
            <div class="dag-node-card" style="left: 430px; top: 165px;">
              <button class="dag-port input"></button>
              <div class="dag-node-head"><span class="runtime-badge codex" style="color: #168d54; border-color: rgba(0,0,0,.1);">codex</span><small>local</small></div>
              <strong>汇总落地</strong>
              <p>等待 2 个依赖</p>
              <button class="dag-port output"></button>
            </div>
            <div class="canvas-hint">拖动节点调整布局 · 点击边上的 × 删除依赖</div>
          </div>
          <aside class="dag-inspector">
            <div class="dag-inspector-title"><div><span class="kicker">NODE INSPECTOR</span><h3>安全审查</h3></div><button class="icon-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
            <label>Node ID<input value="security"></label>
            <label>名称<input value="安全审查"></label>
            <div class="two-fields">
              <label>Runtime<select><option>Codex</option><option>Claude Code</option></select></label>
              <label>Worker<select><option>Local</option></select></label>
            </div>
            <label>Sandbox<select><option>Read only</option><option>Workspace write</option><option>Full access</option></select></label>
            <label>角色提示<textarea>你是安全审查 Agent。</textarea></label>
            <label>节点指令<textarea>独立检查安全风险。</textarea></label>
            <div class="transition-editor">
              <span>终点 Signals</span>
              <div class="transition-row"><input value="completed"><span>→</span><select><option>$done</option><option>$pause</option><option>$fail</option></select></div>
              <div class="transition-row"><input value="need_human"><span>→</span><select><option>$pause</option><option>$done</option><option>$fail</option></select></div>
            </div>
          </aside>
        </div>
        <div class="dag-validation"><button class="text-button">校验 DAG</button><span>保存前会检查环、未知依赖和并行写冲突。</span></div>
      </div>
      <div class="editor-footer"><button class="secondary-button">取消</button><button class="primary-button">校验并保存 DAG</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}"></script>
</body>
</html>
