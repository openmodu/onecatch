version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  package:
    desc: Build an app bundle and distributable ZIP
    deps:
      - task: build
      - task: build:worker
    cmds:
      - ./build/darwin/package.sh

  build:worker:
    desc: Build the headless remote worker shipped with the app
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" ../../cmd/oneshot-worker
    vars:
      BUILD_FLAGS: '-tags production -trimpath -buildvcs=false -ldflags="-w -s"'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR "oneshot-worker")}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  run:
    deps:
      - task: build
        vars:
          DEV: "true"
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}
