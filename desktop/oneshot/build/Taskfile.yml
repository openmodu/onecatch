version: '3'

tasks:
  go:mod:tidy:
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install
      - |
        if [ -d node_modules ] && [ ! -L node_modules ]; then
          rm -rf .node_modules
          mv node_modules .node_modules
          ln -s .node_modules node_modules
        fi

  generate:bindings:
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true

  generate:icons:
    summary: Regenerates the macOS icon assets from the selected source image
    dir: build
    sources:
      - appicon-source.png
      - render_appicon.swift
      - appicon.icon/icon.json
    generates:
      - appicon.png
      - appicon.icon/Assets/oneshot_icon_final.png
      - darwin/Assets.car
      - darwin/icons.icns
    cmds:
      - swift render_appicon.swift appicon-source.png appicon.png
      - cp appicon.png appicon.icon/Assets/oneshot_icon_final.png
      - wails3 generate icons -iconcomposerinput appicon.icon -macassetdir darwin
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns

  build:frontend:
    dir: frontend
    cmds:
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
      - task: install:frontend:deps
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort
