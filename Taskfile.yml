version: '3'

vars:
  APP_NAME: oneshot
  BIN_DIR: bin
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  default:
    silent: true
    cmds:
      - go tool wails3 task -list

  go:mod:tidy:
    internal: true
    cmds:
      - go mod tidy

  frontend:install:
    internal: true
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  desktop:bindings:
    internal: true
    deps:
      - task: go:mod:tidy
    sources:
      - cmd/app/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - go tool wails3 generate bindings -d frontend/bindings -f '{{.BUILD_FLAGS}}' -clean=true ./cmd/app

  frontend:build:
    internal: true
    dir: frontend
    cmds:
      - task: desktop:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
      - task: frontend:install
      - cmd: npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ../build/desktop/windows/run-node.ps1 node_modules/vite/bin/vite.js build {{if eq .DEV "true"}}--minify=false --mode development{{else}}--mode production{{end}}
        platforms: [windows]

  desktop:icons:
    desc: Regenerate the macOS application icon
    dir: build/desktop
    sources:
      - appicon-source.png
      - render_appicon.swift
      - appicon.icon/icon.json
    generates:
      - ../../internal/app/desktop/assets/appicon.png
      - appicon.icon/Assets/oneshot_icon_final.png
      - darwin/Assets.car
      - darwin/icons.icns
    cmds:
      - swift render_appicon.swift appicon-source.png ../../internal/app/desktop/assets/appicon.png
      - cp ../../internal/app/desktop/assets/appicon.png appicon.icon/Assets/oneshot_icon_final.png
      - go tool wails3 generate icons -iconcomposerinput appicon.icon -macassetdir darwin
      - go tool wails3 generate icons -input ../../internal/app/desktop/assets/appicon.png -macfilename darwin/icons.icns

  build:
    cmds:
      - task: frontend:build
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - go build {{.BUILD_FLAGS}} -o '{{.OUTPUT}}' ./cmd/app
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s%s" .BIN_DIR .APP_NAME .EXE_EXT)}}'

  dev:desktop:
    desc: Start the Wails desktop app and Vite dev server
    cmds:
      - cmd: ./build/desktop/dev-session.sh go tool wails3 dev -config ./build/desktop/config.yml -port {{.VITE_PORT}}
        platforms: [darwin]
      - cmd: go tool wails3 dev -config ./build/desktop/config.windows.yml -port {{.VITE_PORT}}
        platforms: [windows]

  build:desktop:
    desc: Build the desktop app with development settings
    cmds:
      - go tool wails3 build DEV=true

  package:desktop:
    desc: Build and package the desktop app for the current platform
    cmds:
      - task: build
        vars:
          DEV: 'false'
      - task: build:worker:package
      - cmd: ./build/desktop/darwin/package.sh
        platforms: [darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./build/desktop/windows/package.ps1
        platforms: [windows]

  build:worker:
    desc: Build the remote worker service
    cmds:
      - cmd: mkdir -p '{{.BIN_DIR}}'
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build -o '{{.BIN_DIR}}/oneshot-worker{{.EXE_EXT}}' ./cmd/worker

  build:worker:package:
    internal: true
    cmds:
      - cmd: mkdir -p '{{.BIN_DIR}}'
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o '{{.BIN_DIR}}/oneshot-worker{{.EXE_EXT}}' ./cmd/worker

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - cmd: npm run dev -- --port {{.VITE_PORT}} --strictPort
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ../build/desktop/windows/run-node.ps1 node_modules/vite/bin/vite.js --port {{.VITE_PORT}} --strictPort
        platforms: [windows]

  test:go:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:frontend:
    desc: Run desktop frontend tests
    dir: frontend
    cmds:
      - npm test

  test:
    desc: Run the repository test suite
    cmds:
      - task: test:go
      - task: test:frontend
