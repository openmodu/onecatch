version: '3'

vars:
  BIN_DIR: bin
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  default:
    cmds: [task --list]
  deps:
    desc: Download Go dependencies
    cmds: [go mod download]
  hooks:install:
    desc: Enable repository Git hooks
    cmds: [git config core.hooksPath .githooks]
  dev:desktop:
    desc: Run the native Keel desktop
    cmds: [go run ./cmd/keel]
  dev:keel:
    cmds: [{task: 'dev:desktop'}]
  build:
    desc: Build a compact native desktop executable
    cmds:
      - go build -trimpath -ldflags='-s -w' -o '{{.BIN_DIR}}/onecatch{{.EXE_EXT}}' ./cmd/app
  build:desktop:
    cmds: [{task: build}]
  build:keel:
    cmds: [{task: build}]
  package:desktop:
    desc: Package the native desktop for the current platform
    cmds: [node build/scripts/package-keel.mjs]
  package:keel:
    cmds: [{task: 'package:desktop'}]
  build:headless:
    desc: Build without desktop dependencies
    cmds:
      - go build -tags onecatch_headless,onecatch_worker -trimpath -ldflags='-s -w' -o '{{.BIN_DIR}}/headless/onecatch{{.EXE_EXT}}' ./cmd/app
  release:check:
    desc: Validate release metadata
    cmds: [node build/scripts/release-info.mjs --check]
  test:go:
    desc: Run Go tests
    cmds: [go test ./...]
  test:release:
    cmds: [node --test build/scripts/release-info.test.mjs build/scripts/update-feed.test.mjs]
  test:conformance:
    cmds: [go test -tags conformance -count=1 -timeout 300s ./internal/usecase/agentrun/...]
  test:
    desc: Run repository tests
    cmds:
      - task: test:go
      - task: test:release
