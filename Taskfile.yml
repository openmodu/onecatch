version: '3'

vars:
  APP_NAME: onecatch
  MOBILE_APP_NAME: onecatch-mobile
  BIN_DIR: bin
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.common.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - go tool wails3 task -list

  deps:
    desc: Install the shared Go and JavaScript dependencies
    cmds:
      - task: common:dependencies

  hooks:install:
    desc: Enable the repository-managed Git hooks
    cmds:
      - git config core.hooksPath .githooks
      - git config --get core.hooksPath

  validate:windows-installer:
    desc: Compile the NSIS installer definition locally with warnings as errors
    platforms: [darwin, linux]
    cmds:
      - ./build/desktop/windows/validate-installer.sh

  desktop:icons:
    desc: Regenerate the macOS application icon
    dir: build/desktop
    sources:
      - appicon-source.png
      - render_appicon.swift
      - appicon.icon/icon.json
    generates:
      - ../../internal/app/desktop/assets/appicon.png
      - appicon.icon/Assets/onecatch_icon_final.png
      - darwin/Assets.car
      - darwin/icons.icns
    cmds:
      - swift render_appicon.swift appicon-source.png ../../internal/app/desktop/assets/appicon.png
      - cp ../../internal/app/desktop/assets/appicon.png appicon.icon/Assets/onecatch_icon_final.png
      - go tool wails3 generate icons -iconcomposerinput appicon.icon -macassetdir darwin
      - go tool wails3 generate icons -input ../../internal/app/desktop/assets/appicon.png -macfilename darwin/icons.icns

  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}12.0{{end}}'
    cmds:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./build/desktop/windows/resources.ps1
        platforms: [windows]
      - go build {{.BUILD_FLAGS}} -o '{{.OUTPUT}}' ./cmd/app
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./build/desktop/windows/resources.ps1 -Clean
        platforms: [windows]
      - cmd: go build {{.BUILD_FLAGS}} -o '{{.BIN_DIR}}/onecatchsh' ./cmd/onecatchsh
        platforms: [darwin, linux]
      - go build {{.BUILD_FLAGS}} -o '{{.BIN_DIR}}/onecatch-askpass{{.EXE_EXT}}' ./cmd/onecatch-askpass
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" {{if eq OS "darwin"}}-ldflags="-extldflags=-mmacosx-version-min=12.0"{{end}}{{else}}-tags production -trimpath -buildvcs=false -ldflags="{{if eq OS "darwin"}}-extldflags=-mmacosx-version-min=12.0 {{end}}{{if eq OS "windows"}}-H=windowsgui {{end}}-w -s"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s%s" .BIN_DIR .APP_NAME .EXE_EXT)}}'

  dev:desktop:
    desc: Start the Wails desktop app and Vite dev server
    env:
      ONECATCH_SSH_ASKPASS: '{{.ROOT_DIR}}/{{.BIN_DIR}}/onecatch-askpass{{.EXE_EXT}}'
      ONECATCH_SHELL_BINARY: '{{.ROOT_DIR}}/{{.BIN_DIR}}/onecatchsh'
    cmds:
      - task: build:shell
      - task: build:askpass
      - cmd: ./build/desktop/dev-session.sh go tool wails3 dev -config ./build/desktop/config.yml -port {{.VITE_PORT}}
        platforms: [darwin, linux]
      - cmd: go tool wails3 dev -config ./build/desktop/config.windows.yml -port {{.VITE_PORT}}
        platforms: [windows]

  build:desktop:
    desc: Build the desktop app with development settings
    cmds:
      - go tool wails3 build DEV=true

  package:desktop:
    desc: Build versioned desktop installers for the current platform
    cmds:
      - task: build
        vars:
          DEV: 'false'
      - task: build:worker:package
      - cmd: ./build/desktop/darwin/package.sh
        platforms: [darwin]
      - cmd: ./build/desktop/linux/package.sh
        platforms: [linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./build/desktop/windows/package.ps1
        platforms: [windows]

  build:ios:
    desc: Build the remote-worker mobile client for the iOS simulator
    cmds:
      - task: ios:build

  run:ios:
    desc: Build and launch the remote-worker mobile client in iOS Simulator
    cmds:
      - task: ios:run

  package:ios:
    desc: Package the remote-worker mobile client as an iOS app bundle
    cmds:
      - task: ios:package

  build:android:
    desc: Build the remote-worker mobile client for Android
    cmds:
      - task: android:build

  run:android:
    desc: Build and launch the remote-worker mobile client in Android Emulator
    cmds:
      - task: android:run

  package:android:
    desc: Package the remote-worker mobile client as an Android APK
    cmds:
      - task: android:package

  build:worker:
    desc: Build the remote worker service
    cmds:
      - cmd: mkdir -p '{{.BIN_DIR}}'
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build -tags onecatch_worker -o '{{.BIN_DIR}}/onecatch-worker{{.EXE_EXT}}' ./cmd/worker

  build:shell:
    desc: Build the agent shell used by remote runs
    platforms: [darwin, linux]
    cmds:
      - mkdir -p '{{.BIN_DIR}}'
      - go build -o '{{.BIN_DIR}}/onecatchsh' ./cmd/onecatchsh

  build:askpass:
    desc: Build the SSH password helper used by Remote FS workspaces
    cmds:
      - cmd: mkdir -p '{{.BIN_DIR}}'
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build -o '{{.BIN_DIR}}/onecatch-askpass{{.EXE_EXT}}' ./cmd/onecatch-askpass

  build:worker:package:
    internal: true
    cmds:
      - cmd: mkdir -p '{{.BIN_DIR}}'
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
        platforms: [windows]
      - go build -tags production,onecatch_worker -trimpath -buildvcs=false -ldflags="-w -s" -o '{{.BIN_DIR}}/onecatch-worker{{.EXE_EXT}}' ./cmd/worker

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - cmd: npm run dev -- --port {{.VITE_PORT}} --strictPort
        platforms: [darwin, linux]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ../build/desktop/windows/run-node.ps1 node_modules/vite/bin/vite.js --port {{.VITE_PORT}} --strictPort
        platforms: [windows]

  test:go:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:frontend:
    desc: Run shared desktop and mobile frontend tests
    dir: frontend
    cmds:
      - npm test

  test:conformance:
    desc: Verify the Claude Code and Codex seams still have the shape the adapters expect
    cmds:
      - go test -tags conformance -count=1 -timeout 300s ./internal/usecase/agentrun/...

  test:
    desc: Run the repository test suite
    cmds:
      - task: test:go
      - task: test:frontend
