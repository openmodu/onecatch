name: Release desktop installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "$GITHUB_REF_NAME"
          go tool wails3 task version:check
      - name: Build macOS installer
        run: go tool wails3 task package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            bin/*.dmg
            bin/*.dmg.sha256
            bin/*-darwin-*.zip
            bin/*-darwin-*.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION=$version"
          }
          go tool wails3 task version:check
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: go tool wails3 task package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            bin/*-Setup.exe
            bin/*-Setup.exe.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dpkg-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config
      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "$GITHUB_REF_NAME"
          go tool wails3 task version:check
      - name: Build Linux packages
        run: go tool wails3 task package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            bin/*.AppImage
            bin/*.AppImage.sha256
            bin/*.deb
            bin/*.deb.sha256
          if-no-files-found: error

  github-release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Generate signed update feeds
        env:
          ONECATCH_UPDATE_PRIVATE_KEY: ${{ secrets.ONECATCH_UPDATE_PRIVATE_KEY }}
        run: |
          node build/scripts/update-feed.mjs generate \
            --dist dist \
            --version "$GITHUB_REF_NAME" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "OneCatch $GITHUB_REF_NAME"
          fi
